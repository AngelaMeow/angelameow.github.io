---
layout: default
---

<div class="main-projects">
    <h2 id="link-projects">Portfolio</h2>
    <div class="posts">      
      {% for post in site.tags.project %}
         <article class="post">
            {%- if post.image -%}
            <a href="{{ site.baseurl }}{{ post.url }}"><img src="{{- post.image | relative_url -}}" alt="" class="post-image"></a>
            {%- else -%}
              {%- assign postImage = "/assets/images/image-default.jpg" -%}
              <img src="{{- postImage | relative_url -}}" alt="" class="post-image">
            {%- endif -%}
            <div class="post-content">
              <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h3>
              <p>{{ post.excerpt }}</p>
              <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
            </div>
          </article> 
      {% endfor %}
 
     </div>
  
  
</div>
